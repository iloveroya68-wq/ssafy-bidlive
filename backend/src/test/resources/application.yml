spring:
  security:
    oauth2:
      client:
        registration:
          kakao:
            provider: kakao
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  datasource:
    url: jdbc:tc:postgresql:17-alpine:///bidlive-test
    username: test
    password: test
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

openvidu:
  url: https://openvidu.test:4443
  secret: test-openvidu-secret

ai:
  gms:
    base-url: https://gms.test/v1
    api-key: test-gms-key
    inspection-model: test-vision-model
    timeout: 2s
    max-retries: 0
    max-concurrent-image-inspections: 2
    max-image-count: 10
  inspection:
    reject-threshold: 0.8
    review-threshold: 0.4

aws:
  s3:
    bucket: bidlive-test-bucket
    region: ap-northeast-2

app:
  oauth2:
    frontend-callback-uri: http://localhost:5173/oauth/callback
    login-code-ttl: 2m
  jwt:
    issuer: bidlive-test
    secret-base64: dGVzdC1qd3Qtc2VjcmV0LW11c3QtYmUtYXQtbGVhc3QtMzItYnl0ZXMtbG9uZw==
    access-token-ttl: 30m
    refresh-token-ttl: 14d
  catch-up-summary:
    cache-ttl: 2m
    min-refresh-interval: 30s
    refresh-lock-ttl: 1m
    source-ttl: 6h
    max-audio-chunk-bytes: 2097152
    allowed-audio-types: audio/webm,audio/ogg,audio/wav,audio/x-wav
    stt-enabled: false
    transcription-path: /audio/transcriptions
    transcription-model: test-transcription-model
    ai-summary-enabled: true
    summary-model: test-summary-model
